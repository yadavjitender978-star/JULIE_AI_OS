name: JULIE AI OS - Build 59 Accessibility

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build-accessibility:
    name: Build JULIE AI OS Accessibility APK
    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout Build 59 Accessibility
        uses: actions/checkout@v4
        with:
          ref: build-59-accessibility
          fetch-depth: 0


      # ============================================================
      # 2. SETUP PYTHON
      # ============================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # ============================================================
      # 3. SETUP JAVA 17
      # ============================================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ============================================================
      # 4. ANDROID BUILD DEPENDENCIES
      # ============================================================

      - name: Install Android Build Dependencies
        shell: bash
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            autopoint \
            gettext \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev \
            build-essential


      # ============================================================
      # 5. INSTALL BUILDOZER TOOLCHAIN
      # ============================================================

      - name: Install Buildozer Toolchain
        shell: bash
        run: |
          set -e

          python -m pip install --upgrade pip

          python -m pip install \
            "setuptools<70" \
            wheel \
            virtualenv

          python -m pip install \
            buildozer

          python -m pip install \
            "Cython==0.29.36"

          echo ""
          echo "=================================================="
          echo "BUILD TOOL VERSIONS"
          echo "=================================================="

          echo ""
          echo "Python:"
          python --version

          echo ""
          echo "Buildozer:"
          buildozer --version

          echo ""
          echo "Cython:"
          python -c "import Cython; print(Cython.__version__)"

          echo ""
          echo "Setuptools:"
          python -c "import setuptools; print(setuptools.__version__)"

          echo ""
          echo "Java:"
          java -version


      # ============================================================
      # 6. VERIFY REQUIRED FILES
      # ============================================================

      - name: Verify JULIE Accessibility Integration
        shell: bash
        run: |
          set -e

          echo "=================================================="
          echo "JULIE ACCESSIBILITY FILE CHECK"
          echo "=================================================="

          REQUIRED_FILES=(
            "accessibility/__init__.py"
            "accessibility/accessibility_bridge.py"
            "accessibility/accessibility_service.py"
            "accessibility/accessibility_service_manifest.xml"
            "android_src/org/julie/ai/JulieAccessibilityService.java"
            "android_src/res/xml/julie_accessibility_service.xml"
            "android_src/res/values/strings.xml"
            "buildozer.spec"
            "main.py"
          )

          for FILE in "${REQUIRED_FILES[@]}"; do
            if [ ! -f "$FILE" ]; then
              echo "::error title=Missing JULIE File::$FILE"
              exit 1
            fi

            echo "OK: $FILE"
          done

          echo ""
          echo "All required JULIE Accessibility files are present."


      # ============================================================
      # 7. VERIFY PYTHON ACCESSIBILITY BRIDGE
      # ============================================================

      - name: Validate Accessibility Python Bridge
        shell: bash
        run: |
          set -e

          echo "=================================================="
          echo "PYTHON ACCESSIBILITY BRIDGE CHECK"
          echo "=================================================="

          python -m py_compile \
            accessibility/accessibility_bridge.py

          python -m py_compile \
            accessibility/accessibility_service.py

          grep -q \
            "from jnius import autoclass" \
            accessibility/accessibility_bridge.py

          grep -q \
            "JulieAccessibilityService" \
            accessibility/accessibility_bridge.py

          grep -q \
            "getInstance" \
            accessibility/accessibility_bridge.py

          echo "Python Accessibility bridge validation passed."


      # ============================================================
      # 8. VERIFY JAVA ACCESSIBILITY SERVICE
      # ============================================================

      - name: Validate Accessibility Java Service
        shell: bash
        run: |
          set -e

          JAVA_FILE="android_src/org/julie/ai/JulieAccessibilityService.java"

          echo "=================================================="
          echo "JAVA ACCESSIBILITY SERVICE CHECK"
          echo "=================================================="

          grep -q \
            "package org.julie.ai;" \
            "$JAVA_FILE"

          grep -q \
            "extends AccessibilityService" \
            "$JAVA_FILE"

          grep -q \
            "onServiceConnected" \
            "$JAVA_FILE"

          grep -q \
            "onAccessibilityEvent" \
            "$JAVA_FILE"

          grep -q \
            "onInterrupt" \
            "$JAVA_FILE"

          grep -q \
            "onDestroy" \
            "$JAVA_FILE"

          echo "Java Accessibility Service validation passed."


      # ============================================================
      # 9. VALIDATE ACCESSIBILITY XML
      # ============================================================

      - name: Validate Accessibility Resource XML
        shell: bash
        run: |
          set -e

          echo "=================================================="
          echo "ACCESSIBILITY RESOURCE XML CHECK"
          echo "=================================================="

          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          files = [
              Path("android_src/res/xml/julie_accessibility_service.xml"),
              Path("android_src/res/values/strings.xml"),
          ]

          for path in files:
              print(f"Checking: {path}")
              ET.parse(path)
              print(f"OK: {path}")

          xml_file = Path(
              "android_src/res/xml/julie_accessibility_service.xml"
          )

          text = xml_file.read_text(encoding="utf-8")

          forbidden = (
              'android:description="@string/julie_accessibility_description"'
          )

          if forbidden in text:
              raise RuntimeError(
                  "Unresolved android:description resource reference "
                  "still exists in accessibility XML."
              )

          print("")
          print(
              "Accessibility XML contains no unresolved "
              "description resource reference."
          )

          print("")
          print("Accessibility XML validation passed.")
          PY


      # ============================================================
      # 10. VALIDATE ACCESSIBILITY MANIFEST
      # ============================================================

      - name: Validate Accessibility Manifest Fragment
        shell: bash
        run: |
          set -e

          echo "=================================================="
          echo "ACCESSIBILITY MANIFEST CHECK"
          echo "=================================================="

          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          path = Path(
              "accessibility/accessibility_service_manifest.xml"
          )

          text = path.read_text(
              encoding="utf-8"
          ).strip()

          if not text:
              raise RuntimeError(
                  "Accessibility manifest fragment is empty."
              )

          if "<service" not in text:
              raise RuntimeError(
                  "Accessibility manifest fragment "
                  "does not contain <service>."
              )

          wrapper = (
              '<application '
              'xmlns:android="http://schemas.android.com/apk/res/android">'
              + text +
              "</application>"
          )

          ET.fromstring(wrapper)

          print(
              "Accessibility manifest XML validation passed."
          )
          PY

          grep -q \
            "JulieAccessibilityService" \
            accessibility/accessibility_service_manifest.xml

          grep -q \
            "BIND_ACCESSIBILITY_SERVICE" \
            accessibility/accessibility_service_manifest.xml

          grep -q \
            "android.accessibilityservice.AccessibilityService" \
            accessibility/accessibility_service_manifest.xml

          echo "Accessibility manifest integration passed."


      # ============================================================
      # 11. VALIDATE BUILDOZER CONFIGURATION
      # ============================================================

      - name: Validate Buildozer Configuration
        shell: bash
        run: |
          set -e

          echo "=================================================="
          echo "BUILDOZER CONFIGURATION CHECK"
          echo "=================================================="

          grep -n "^requirements" buildozer.spec
          grep -n "^android.api" buildozer.spec
          grep -n "^android.minapi" buildozer.spec
          grep -n "^android.ndk_api" buildozer.spec
          grep -n "^android.archs" buildozer.spec
          grep -n "^android.permissions" buildozer.spec
          grep -n "^android.add_src" buildozer.spec
          grep -n "^android.add_resources" buildozer.spec
          grep -n "^android.res_xml" buildozer.spec
          grep -n "^android.extra_manifest_application_xml" buildozer.spec

          echo ""
          echo "Checking required requirements..."

          grep -q \
            "^requirements = python3,kivy,pyjnius$" \
            buildozer.spec

          if grep -q \
            "^requirements.*android" \
            buildozer.spec; then
            echo "::error title=Invalid Requirements::The standalone 'android' package must not be in Buildozer requirements."
            exit 1
          fi

          echo ""
          echo "Checking Accessibility configuration..."

          grep -q \
            "BIND_ACCESSIBILITY_SERVICE" \
            buildozer.spec

          grep -q \
            "android_src" \
            buildozer.spec

          grep -q \
            "android.extra_manifest_application_xml" \
            buildozer.spec

          echo ""
          echo "Buildozer configuration validation passed."


      # ============================================================
      # 12. SHOW BUILD CONFIGURATION
      # ============================================================

      - name: Show Final Build Configuration
        shell: bash
        run: |
          set -e

          echo "=================================================="
          echo "FINAL BUILDOZER SPEC"
          echo "=================================================="

          cat buildozer.spec


      # ============================================================
      # 13. SHOW ACCESSIBILITY TREE
      # ============================================================

      - name: Show Accessibility File Tree
        shell: bash
        run: |
          set -e

          echo "=================================================="
          echo "JULIE ACCESSIBILITY TREE"
          echo "=================================================="

          find accessibility android_src \
            -type f \
            -print \
            | sort


      # ============================================================
      # 14. CLEAN ALL LOCAL BUILDOZER OUTPUT
      # ============================================================

      - name: Clean Previous Build
        shell: bash
        run: |
          set -e

          echo "=================================================="
          echo "CLEAN BUILD"
          echo "=================================================="

          rm -rf .buildozer
          rm -rf bin

          echo "Cleaned:"
          echo "  .buildozer"
          echo "  bin"


      # ============================================================
      # 15. SHOW ENVIRONMENT
      # ============================================================

      - name: Show Build Environment
        shell: bash
        run: |
          set -e

          echo "=================================================="
          echo "BUILD ENVIRONMENT"
          echo "=================================================="

          echo "Python:"
          python --version

          echo ""
          echo "Cython:"
          python -c "import Cython; print(Cython.__version__)"

          echo ""
          echo "Setuptools:"
          python -c "import setuptools; print(setuptools.__version__)"

          echo ""
          echo "Buildozer:"
          buildozer --version

          echo ""
          echo "Java:"
          java -version


      # ============================================================
      # 16. BUILD APK
      # ============================================================

      - name: Build APK
        shell: bash
        run: |
          set -o pipefail

          echo "=================================================="
          echo "JULIE AI OS ACCESSIBILITY APK BUILD"
          echo "=================================================="

          yes | buildozer -v android debug 2>&1 | tee build.log


      # ============================================================
      # 17. REMOVE PROBLEM MATCHER IF PRESENT
      # ============================================================

      - name: Remove JULIE Problem Matcher
        if: always()
        shell: bash
        run: |
          set +e

          echo "::remove-matcher owner=julie-build::" || true

          echo "Problem matcher cleanup completed."


      # ============================================================
      # 18. EXTRACT REAL BUILD FAILURE
      # ============================================================

      - name: Extract and Annotate Build Errors
        if: failure()
        shell: bash
        run: |
          set +e

          echo "=================================================="
          echo "JULIE AI OS BUILD DIAGNOSTIC"
          echo "=================================================="

          LOG_FILE="build.log"

          if [ ! -f "$LOG_FILE" ]; then
            echo "::error title=JULIE Build Failed::build.log was not created"

            {
              echo "## 🚨 JULIE AI OS Build Error"
              echo ""
              echo "build.log was not created."
            } >> "$GITHUB_STEP_SUMMARY"

            exit 0
          fi

          TOTAL_LINES=$(wc -l < "$LOG_FILE")

          echo ""
          echo "Total build log lines: $TOTAL_LINES"

          # --------------------------------------------------------
          # Find high-confidence build-stopping errors.
          # --------------------------------------------------------

          TRUE_FAILURE_LINES=$(
            grep -n -E \
              "FAILURE:|Execution failed for task|BUILD FAILED|AAPT: error:|Manifest merger failed|fatal error:|Command failed:|No matching distribution found|Could not find a version that satisfies|error:.*failed|ERROR:.*failed|Exception in thread|Traceback \(most recent call last\)" \
              "$LOG_FILE" \
              | tail -n 120
          )

          if [ -z "$TRUE_FAILURE_LINES" ]; then
            TRUE_FAILURE_LINES=$(
              grep -n -E \
                "error:|ERROR:|failed|FAILED|Exception" \
                "$LOG_FILE" \
                | tail -n 160
            )
          fi

          if [ -z "$TRUE_FAILURE_LINES" ]; then
            TRUE_FAILURE_LINES=$(
              tail -n 250 "$LOG_FILE"
            )
          fi

          echo ""
          echo "=================================================="
          echo "BUILD FAILURE CANDIDATES"
          echo "=================================================="

          echo "$TRUE_FAILURE_LINES"

          # --------------------------------------------------------
          # Explicitly detect known JULIE dependency failures.
          # --------------------------------------------------------

          P4A_DEPENDENCY_ERRORS=$(
            grep -n -E \
              "No matching distribution found for (pyjnius|android|kivy)|Could not find a version that satisfies the requirement (pyjnius|android|kivy)" \
              "$LOG_FILE" \
              | tail -n 30
          )

          # --------------------------------------------------------
          # Explicitly detect config.pxi diagnostics.
          # These are reported separately and are NOT automatically
          # declared the root cause.
          # --------------------------------------------------------

          CONFIG_PXI_ERRORS=$(
            grep -n \
              "Dependency for .*\.pyx not resolved: config\.pxi" \
              "$LOG_FILE" \
              | tail -n 50
          )

          if [ -n "$P4A_DEPENDENCY_ERRORS" ]; then
            ROOT_ERROR=$(
              echo "$P4A_DEPENDENCY_ERRORS" \
                | tail -n 1
            )
            ROOT_CLASS="Python/p4a dependency resolution failure"
          else
            ROOT_ERROR=$(
              echo "$TRUE_FAILURE_LINES" \
                | tail -n 1
            )
            ROOT_CLASS="Final build failure candidate"
          fi

          if [ -z "$ROOT_ERROR" ]; then
            ROOT_ERROR="Build failed. See complete diagnostic."
          fi

          SAFE_ROOT_ERROR=$(
            echo "$ROOT_ERROR" \
              | sed \
                's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g'
          )

          echo ""
          echo "ROOT CLASS:"
          echo "$ROOT_CLASS"

          echo ""
          echo "ROOT ERROR:"
          echo "$ROOT_ERROR"

          echo "::error title=JULIE AI OS Build Failed::$SAFE_ROOT_ERROR"

          {
            echo "## 🚨 JULIE AI OS Build Failed"
            echo ""
            echo "**Classification:** $ROOT_CLASS"
            echo ""
            echo "**Root error:**"
            echo ""
            echo '```text'
            echo "$ROOT_ERROR"
            echo '```'
            echo ""
            echo "**Relevant build diagnostics:**"
            echo ""
            echo '```text'
            echo "$TRUE_FAILURE_LINES"
            echo '```'
            echo ""

            if [ -n "$P4A_DEPENDENCY_ERRORS" ]; then
              echo "**Python/p4a dependency diagnostics:**"
              echo ""
              echo '```text'
              echo "$P4A_DEPENDENCY_ERRORS"
              echo '```'
              echo ""
            fi

            if [ -n "$CONFIG_PXI_ERRORS" ]; then
              echo "**config.pxi diagnostics:**"
              echo ""
              echo '```text'
              echo "$CONFIG_PXI_ERRORS"
              echo '```'
              echo ""
              echo "config.pxi diagnostics are reported separately."
              echo "They are not automatically classified as the root failure."
              echo ""
            fi

          } >> "$GITHUB_STEP_SUMMARY"

          {
            echo "JULIE AI OS BUILD DIAGNOSTIC"
            echo "============================"
            echo ""
            echo "TOTAL LOG LINES:"
            echo "$TOTAL_LINES"
            echo ""
            echo "ROOT CLASS:"
            echo "$ROOT_CLASS"
            echo ""
            echo "ROOT ERROR:"
            echo "$ROOT_ERROR"
            echo ""
            echo "RELEVANT FINAL DIAGNOSTICS:"
            echo "$TRUE_FAILURE_LINES"
            echo ""
            echo "PYTHON/P4A DEPENDENCY DIAGNOSTICS:"
            echo "$P4A_DEPENDENCY_ERRORS"
            echo ""
            echo "CONFIG.PXI DIAGNOSTICS:"
            echo "$CONFIG_PXI_ERRORS"
          } > filtered_build_errors.txt

          echo ""
          echo "Diagnostic extraction completed."


      # ============================================================
      # 19. PREPARE MANUAL AI REVIEW PACKAGE
      # ============================================================

      - name: Prepare Manual AI Review Package
        if: failure()
        shell: bash
        run: |
          set +e

          REVIEW_FILE="ai_error_review.txt"

          {
            echo "JULIE AI OS - BUILD ERROR REVIEW"
            echo "================================="
            echo ""
            echo "Workflow: $GITHUB_WORKFLOW"
            echo "Run: $GITHUB_RUN_NUMBER"
            echo "Branch: $GITHUB_REF_NAME"
            echo "Commit: $GITHUB_SHA"
            echo ""
            echo "REVIEW RULES"
            echo "------------"
            echo "1. Identify the actual build-stopping failure."
            echo "2. Separate root cause from secondary diagnostics."
            echo "3. Do not automatically classify config.pxi as root cause."
            echo "4. Preserve AccessibilityService functionality."
            echo "5. Preserve screen-content retrieval."
            echo "6. Preserve gesture capability."
            echo "7. Preserve Accessibility event handling."
            echo "8. Do not remove PyJNIus if the Python bridge uses jnius."
            echo ""
            echo "BUILD DIAGNOSTICS"
            echo "-----------------"

            if [ -f filtered_build_errors.txt ]; then
              cat filtered_build_errors.txt
            elif [ -f build.log ]; then
              tail -n 300 build.log
            else
              echo "No diagnostic file available."
            fi

            echo ""
            echo "END OF REVIEW PACKAGE"

          } > "$REVIEW_FILE"

          echo "Manual AI review package created: $REVIEW_FILE"


      # ============================================================
      # 20. PREPARE ACTION-READY REVIEW
      # ============================================================

      - name: Prepare Action-Ready AI Review Input
        if: failure()
        shell: bash
        run: |
          set +e

          REVIEW_INPUT="action_ready_ai_review.md"

          {
            echo "# JULIE AI OS - Action-Ready Build Error Review"
            echo ""
            echo "## Build Context"
            echo ""
            echo "- Workflow: ${GITHUB_WORKFLOW}"
            echo "- Run: ${GITHUB_RUN_NUMBER}"
            echo "- Branch: ${GITHUB_REF_NAME}"
            echo "- Commit: ${GITHUB_SHA}"
            echo ""
            echo "## Required Analysis"
            echo ""
            echo "1. Identify the exact build-stopping error."
            echo "2. Separate root cause from secondary warnings."
            echo "3. Check Python, Buildozer, python-for-android, Cython, Kivy, PyJNIus, Gradle and Android resource stages."
            echo "4. Do not treat config.pxi messages as fatal unless a confirmed later failure establishes that."
            echo "5. Preserve all Accessibility functionality."
            echo "6. Do not remove JulieAccessibilityService."
            echo "7. Do not remove gesture capability."
            echo "8. Do not remove window-content retrieval."
            echo "9. Provide exact file and line changes."
            echo "10. Provide complete replacement files when required."
            echo ""
            echo "## Diagnostic"
            echo ""
            echo '```text'

            if [ -f filtered_build_errors.txt ]; then
              cat filtered_build_errors.txt
            elif [ -f ai_error_review.txt ]; then
              cat ai_error_review.txt
            elif [ -f build.log ]; then
              tail -n 300 build.log
            else
              echo "No diagnostic data available."
            fi

            echo '```'
            echo ""
            echo "## Privacy"
            echo ""
            echo "No external AI API was called."
            echo "This file is for manual review only."

          } > "$REVIEW_INPUT"

          if [ ! -s "$REVIEW_INPUT" ]; then
            echo "::error title=Review Input Failed::Review input is empty"
            exit 1
          fi

          echo "Action-ready review input created: $REVIEW_INPUT"


      # ============================================================
      # 21. FINAL DIAGNOSTIC SUMMARY
      # ============================================================

      - name: Show Final Diagnostic Summary
        if: failure()
        shell: bash
        run: |
          set +e

          echo "=================================================="
          echo "JULIE FINAL BUILD DIAGNOSTIC"
          echo "=================================================="

          if [ -f filtered_build_errors.txt ]; then
            echo ""
            echo "FILTERED BUILD ERRORS"
            echo "---------------------"
            cat filtered_build_errors.txt
          fi

          if [ -f ai_error_review.txt ]; then
            echo ""
            echo "MANUAL AI REVIEW PACKAGE"
            echo "------------------------"
            cat ai_error_review.txt
          fi

          if [ -f action_ready_ai_review.md ]; then
            echo ""
            echo "ACTION-READY REVIEW"
            echo "-------------------"
            cat action_ready_ai_review.md
          fi

          echo ""
          echo "=================================================="
          echo "END JULIE FINAL BUILD DIAGNOSTIC"
          echo "=================================================="


      # ============================================================
      # 22. UPLOAD BUILD DIAGNOSTICS
      # ============================================================

      - name: Upload Build Diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: JULIE_AI_OS_Build59_Diagnostics
          path: |
            build.log
            filtered_build_errors.txt
            ai_error_review.txt
            action_ready_ai_review.md
            buildozer.spec
          if-no-files-found: ignore
          retention-days: 14


      # ============================================================
      # 23. LIST GENERATED APK
      # ============================================================

      - name: List APK
        if: success()
        shell: bash
        run: |
          set -e

          echo "=================================================="
          echo "GENERATED APK FILES"
          echo "=================================================="

          if [ ! -d bin ]; then
            echo "::error title=APK Missing::bin directory was not created."
            exit 1
          fi

          APK_COUNT=$(
            find bin \
              -maxdepth 1 \
              -type f \
              -name "*.apk" \
              | wc -l
          )

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "::error title=APK Missing::No APK file was generated."
            exit 1
          fi

          echo "APK count: $APK_COUNT"
          echo ""

          find bin \
            -maxdepth 1 \
            -type f \
            -name "*.apk" \
            -print \
            -exec ls -lh {} \;


      # ============================================================
      # 24. UPLOAD APK
      # ============================================================

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: JULIE_AI_OS_Build59_Accessibility
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 14