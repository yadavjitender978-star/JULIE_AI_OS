name: JULIE AI OS - Build 59 Accessibility

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:

  build-accessibility:

    name: Build JULIE AI OS Accessibility APK

    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout Build 59 Accessibility
        uses: actions/checkout@v4
        with:
          ref: build-59-accessibility
          fetch-depth: 0


      # ============================================================
      # 2. SETUP PYTHON
      # ============================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # ============================================================
      # 3. SETUP JAVA 17
      # ============================================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ============================================================
      # 4. ANDROID BUILD DEPENDENCIES
      # ============================================================

      - name: Install Android Build Dependencies
        shell: bash
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            autopoint \
            gettext \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo5 \
            cmake \
            libffi-dev \
            libssl-dev \
            build-essential


      # ============================================================
      # 5. INSTALL BUILDOZER + COMPATIBLE CYTHON
      # ============================================================

      - name: Install Buildozer Toolchain
        shell: bash
        run: |
          set -e

          python -m pip install --upgrade pip

          python -m pip install \
            "setuptools<70" \
            wheel \
            virtualenv

          python -m pip install \
            buildozer

          python -m pip install \
            "Cython==0.29.34"

          echo ""
          echo "=================================================="
          echo "BUILD TOOL VERSIONS"
          echo "=================================================="

          echo ""
          echo "Python:"
          python --version

          echo ""
          echo "Buildozer:"
          buildozer --version

          echo ""
          echo "Cython:"
          python -c "import Cython; print(Cython.__version__)"

          echo ""
          echo "Setuptools:"
          python -c "import setuptools; print(setuptools.__version__)"

          echo ""
          echo "Java:"
          java -version


      # ============================================================
      # 6. VERIFY ACCESSIBILITY FILES
      # ============================================================

      - name: Verify Accessibility Integration
        shell: bash
        run: |
          set -e

          echo "=================================================="
          echo "JULIE ACCESSIBILITY FILE CHECK"
          echo "=================================================="

          REQUIRED_FILES=(
            "accessibility/__init__.py"
            "accessibility/accessibility_bridge.py"
            "accessibility/accessibility_service.py"
            "accessibility/accessibility_service_manifest.xml"
            "android_src/org/julie/ai/JulieAccessibilityService.java"
            "android_src/res/xml/julie_accessibility_service.xml"
            "android_src/res/values/strings.xml"
            "buildozer.spec"
            "main.py"
          )

          for FILE in "${REQUIRED_FILES[@]}"; do

            if [ ! -f "$FILE" ]; then
              echo ""
              echo "::error title=Missing Accessibility File::$FILE"
              exit 1
            fi

            echo "OK: $FILE"

          done

          echo ""
          echo "=================================================="
          echo "ACCESSIBILITY JAVA SERVICE"
          echo "=================================================="

          grep -n \
            "class JulieAccessibilityService" \
            android_src/org/julie/ai/JulieAccessibilityService.java

          echo ""
          echo "=================================================="
          echo "ACCESSIBILITY XML"
          echo "=================================================="

          grep -n \
            "accessibility-service" \
            android_src/res/xml/julie_accessibility_service.xml

          echo ""
          echo "Accessibility files are present."

          echo ""
          echo "IMPORTANT:"
          echo "No custom android:description rejection check is performed."
          echo "The Android Accessibility XML is preserved unchanged."


      # ============================================================
      # 7. VALIDATE ACCESSIBILITY RESOURCE XML SYNTAX ONLY
      # ============================================================

      - name: Validate Accessibility Resource XML
        shell: bash
        run: |
          set -e

          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          resource_files = [
              Path(
                  "android_src/res/xml/julie_accessibility_service.xml"
              ),
              Path(
                  "android_src/res/values/strings.xml"
              ),
          ]

          for path in resource_files:

              print(f"Checking Android resource XML: {path}")

              if not path.is_file():
                  raise RuntimeError(
                      f"Missing Android resource XML: {path}"
                  )

              ET.parse(path)

              print(f"OK: {path}")

          print("")
          print("Accessibility resource XML syntax validation passed.")
          PY


      # ============================================================
      # 8. VALIDATE ACCESSIBILITY MANIFEST
      # ============================================================

      - name: Validate Accessibility Manifest Fragment
        shell: bash
        run: |
          set -e

          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          manifest_fragment = Path(
              "accessibility/accessibility_service_manifest.xml"
          )

          if not manifest_fragment.is_file():
              raise RuntimeError(
                  "Accessibility manifest fragment is missing."
              )

          fragment = manifest_fragment.read_text(
              encoding="utf-8"
          ).strip()

          if not fragment:
              raise RuntimeError(
                  "Accessibility manifest fragment is empty."
              )

          if "<service" not in fragment:
              raise RuntimeError(
                  "Accessibility manifest fragment does not contain <service>."
              )

          wrapper = f"""
          <application
              xmlns:android="http://schemas.android.com/apk/res/android">
              {fragment}
          </application>
          """

          ET.fromstring(wrapper)

          print(
              "OK: accessibility/accessibility_service_manifest.xml"
          )

          print(
              "Accessibility manifest fragment validation passed."
          )
          PY


      # ============================================================
      # 9. VALIDATE JAVA
      # ============================================================

      - name: Validate Java Source
        shell: bash
        run: |
          set -e

          JAVA_FILE="android_src/org/julie/ai/JulieAccessibilityService.java"

          echo "Checking Java source..."

          grep -q \
            "package org.julie.ai;" \
            "$JAVA_FILE"

          grep -q \
            "extends AccessibilityService" \
            "$JAVA_FILE"

          grep -q \
            "onServiceConnected" \
            "$JAVA_FILE"

          grep -q \
            "onAccessibilityEvent" \
            "$JAVA_FILE"

          grep -q \
            "onInterrupt" \
            "$JAVA_FILE"

          grep -q \
            "onDestroy" \
            "$JAVA_FILE"

          echo "Java Accessibility Service source validation passed."


      # ============================================================
      # 10. VALIDATE BUILDOZER CONFIGURATION
      # ============================================================

      - name: Validate Buildozer Configuration
        shell: bash
        run: |
          set -e

          echo "=================================================="
          echo "BUILD CONFIGURATION"
          echo "=================================================="

          grep -n "^requirements" buildozer.spec
          grep -n "^android.api" buildozer.spec
          grep -n "^android.minapi" buildozer.spec
          grep -n "^android.ndk_api" buildozer.spec
          grep -n "^android.archs" buildozer.spec
          grep -n "^android.permissions" buildozer.spec
          grep -n "^android.add_src" buildozer.spec
          grep -n "^android.res_xml" buildozer.spec
          grep -n "^android.add_resources" buildozer.spec
          grep -n "^android.extra_manifest_application_xml" buildozer.spec

          echo ""
          echo "Checking required Accessibility configuration..."

          grep -q \
            "BIND_ACCESSIBILITY_SERVICE" \
            buildozer.spec

          grep -q \
            "android_src" \
            buildozer.spec

          grep -q \
            "android.extra_manifest_application_xml" \
            buildozer.spec

          grep -q \
            "requirements = python3,kivy" \
            buildozer.spec

          echo ""
          echo "Buildozer Accessibility configuration detected."


      # ============================================================
      # 11. SHOW FINAL BUILD CONFIGURATION
      # ============================================================

      - name: Show Final Build Configuration
        shell: bash
        run: |
          set -e

          echo "=================================================="
          echo "FINAL BUILDOZER SPEC"
          echo "=================================================="

          cat buildozer.spec


      # ============================================================
      # 12. SHOW ACCESSIBILITY TREE
      # ============================================================

      - name: Show Accessibility File Tree
        shell: bash
        run: |
          set -e

          echo "=================================================="
          echo "ACCESSIBILITY TREE"
          echo "=================================================="

          find accessibility android_src \
            -type f \
            -print \
            | sort


      # ============================================================
      # 13. CHECK GIT STATUS
      # ============================================================

      - name: Check Git Changes
        shell: bash
        run: |
          echo "=================================================="
          echo "GIT STATUS"
          echo "=================================================="

          git status --short


      # ============================================================
      # 14. COMMIT BUILD CONFIGURATION
      # ============================================================

      - name: Commit Build Configuration
        shell: bash
        run: |
          set -e

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add buildozer.spec

          if git diff --cached --quiet; then

            echo "No build configuration changes to commit."

          else

            git commit \
              -m "Build 59: stabilize Kivy Accessibility build"

          fi


      # ============================================================
      # 15. PUSH CONFIGURATION
      # ============================================================

      - name: Push Build Configuration
        shell: bash
        run: |
          set -e

          git push \
            origin \
            HEAD:build-59-accessibility


      # ============================================================
      # 16. CREATE JULIE PROBLEM MATCHER
      # ============================================================

      - name: Create JULIE Problem Matcher
        shell: bash
        run: |
          set -e

          mkdir -p .github/problem-matchers

          cat > .github/problem-matchers/julie-build.json <<'JSON'
          {
            "problemMatcher": [
              {
                "owner": "julie-build",
                "severity": "error",
                "pattern": [
                  {
                    "regexp": "^.*?([^\\s]+\\.(?:py|java|xml|kt|gradle|spec)):(\\d+):(?:\\s*\\d+:)?\\s*(?:AAPT:\\s*)?(?:error:|ERROR:)?\\s*(.*)$",
                    "file": 1,
                    "line": 2,
                    "message": 3
                  }
                ]
              }
            ]
          }
          JSON

          echo "=================================================="
          echo "JULIE PROBLEM MATCHER"
          echo "=================================================="

          cat .github/problem-matchers/julie-build.json


      # ============================================================
      # 17. ACTIVATE PROBLEM MATCHER
      # ============================================================

      - name: Activate JULIE Problem Matcher
        shell: bash
        run: |
          set -e

          echo "::add-matcher::.github/problem-matchers/julie-build.json"

          echo ""
          echo "JULIE Problem Matcher is active."


      # ============================================================
      # 18. CLEAN OLD BUILD
      # ============================================================

      - name: Clean Previous Build
        shell: bash
        run: |
          set -e

          rm -rf .buildozer
          rm -rf bin

          echo "Previous Buildozer output removed."


      # ============================================================
      # 19. BUILD APK
      # ============================================================

      - name: Build APK
        shell: bash
        run: |
          set -o pipefail

          yes | buildozer -v android debug 2>&1 | tee build.log


      # ============================================================
      # 20. REMOVE PROBLEM MATCHER
      # ============================================================

      - name: Remove JULIE Problem Matcher
        if: always()
        shell: bash
        run: |
          set +e

          echo "::remove-matcher owner=julie-build::"

          echo "JULIE Problem Matcher removed."


      # ============================================================
      # 21. EXTRACT REAL BUILD FAILURE
      # ============================================================

      - name: Extract and Annotate Build Errors
        if: failure()
        shell: bash
        run: |
          set +e

          echo "=================================================="
          echo "JULIE AI OS BUILD DIAGNOSTIC"
          echo "=================================================="

          LOG_FILE="build.log"

          if [ ! -f "$LOG_FILE" ]; then

            echo "::error title=JULIE Build Failed::build.log was not created"

            {
              echo "## 🚨 JULIE AI OS Build Error"
              echo ""
              echo "build.log was not created."
            } >> "$GITHUB_STEP_SUMMARY"

            exit 0

          fi

          echo ""
          echo "Scanning build log..."

          TOTAL_LINES=$(wc -l < "$LOG_FILE")

          echo "Total build log lines: $TOTAL_LINES"

          TRUE_FAILURE_LINES=$(
            grep -n -E \
              "FAILURE:|Execution failed for task|BUILD FAILED|AAPT: error:|Manifest merger failed|fatal error:|Command failed:|ERROR:.*failed|error:.*failed|Could not find|No matching distribution found|Exception in thread|Traceback \(most recent call last\)" \
              "$LOG_FILE" \
              | tail -n 80
          )

          if [ -z "$TRUE_FAILURE_LINES" ]; then

            TRUE_FAILURE_LINES=$(
              grep -n -E \
                "error:|ERROR:|failed|FAILED|Exception" \
                "$LOG_FILE" \
                | tail -n 120
            )

          fi

          if [ -z "$TRUE_FAILURE_LINES" ]; then

            TRUE_FAILURE_LINES=$(
              tail -n 200 "$LOG_FILE"
            )

          fi

          echo ""
          echo "=================================================="
          echo "FINAL BUILD FAILURE CANDIDATES"
          echo "=================================================="

          echo "$TRUE_FAILURE_LINES"

          ROOT_ERROR=$(
            echo "$TRUE_FAILURE_LINES" \
              | tail -n 1
          )

          if [ -z "$ROOT_ERROR" ]; then

            ROOT_ERROR="Build failed. See complete diagnostic."

          fi

          SAFE_ROOT_ERROR=$(
            echo "$ROOT_ERROR" \
              | sed \
                's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g'
          )

          echo "::error title=JULIE AI OS Build Failed::$SAFE_ROOT_ERROR"

          {
            echo "## 🚨 JULIE AI OS Build Failed"
            echo ""
            echo "**Final failure candidate:**"
            echo ""
            echo '```text'
            echo "$ROOT_ERROR"
            echo '```'
            echo ""
            echo "**Relevant final diagnostics:**"
            echo ""
            echo '```text'
            echo "$TRUE_FAILURE_LINES"
            echo '```'
            echo ""
            echo "**Important:**"
            echo ""
            echo "Accessibility XML is not rejected based on android:description."
            echo "Only actual XML syntax and final build failures are treated as errors."
          } >> "$GITHUB_STEP_SUMMARY"

          {
            echo "JULIE AI OS BUILD DIAGNOSTIC"
            echo "============================"
            echo ""
            echo "TOTAL LOG LINES:"
            echo "$TOTAL_LINES"
            echo ""
            echo "FINAL FAILURE CANDIDATE:"
            echo "$ROOT_ERROR"
            echo ""
            echo "RELEVANT FINAL DIAGNOSTICS:"
            echo "$TRUE_FAILURE_LINES"
          } > filtered_build_errors.txt

          echo ""
          echo "Diagnostic extraction completed."


      # ============================================================
      # 22. PREPARE MANUAL AI REVIEW PACKAGE
      # ============================================================

      - name: Prepare Manual AI Review Package
        if: failure()
        shell: bash
        run: |
          set +e

          REVIEW_FILE="ai_error_review.txt"

          {
            echo "JULIE AI OS - BUILD ERROR REVIEW"
            echo "================================="
            echo ""
            echo "Workflow: $GITHUB_WORKFLOW"
            echo "Run: $GITHUB_RUN_NUMBER"
            echo "Branch: $GITHUB_REF_NAME"
            echo "Commit: $GITHUB_SHA"
            echo ""
            echo "IMPORTANT"
            echo "---------"
            echo "The diagnostic prioritizes actual build-stopping errors."
            echo "Accessibility android:description is not treated as an automatic failure."
            echo ""
            echo "BUILD DIAGNOSTICS"
            echo "-----------------"

            if [ -f filtered_build_errors.txt ]; then
              cat filtered_build_errors.txt
            elif [ -f build.log ]; then
              tail -n 250 build.log
            else
              echo "No diagnostic file available."
            fi

            echo ""
            echo "END OF REVIEW PACKAGE"

          } > "$REVIEW_FILE"

          echo "Manual AI review package created."


      # ============================================================
      # 23. PREPARE ACTION-READY REVIEW
      # ============================================================

      - name: Prepare Action-Ready AI Review Input
        if: failure()
        shell: bash
        run: |
          set +e

          REVIEW_INPUT="action_ready_ai_review.md"

          {
            echo "# JULIE AI OS - Action-Ready Build Error Review"
            echo ""
            echo "## Build Context"
            echo ""
            echo "- Workflow: ${GITHUB_WORKFLOW}"
            echo "- Run: ${GITHUB_RUN_NUMBER}"
            echo "- Branch: ${GITHUB_REF_NAME}"
            echo "- Commit: ${GITHUB_SHA}"
            echo ""
            echo "## Analysis Rules"
            echo ""
            echo "1. Identify the actual build-stopping error."
            echo "2. Do not classify warnings as root failures."
            echo "3. Do not reject Accessibility XML solely because android:description exists."
            echo "4. Identify exact file and line when available."
            echo "5. Preserve Accessibility integration."
            echo "6. Do not remove Accessibility functionality."
            echo "7. Provide production-safe fixes."
            echo ""
            echo "## Diagnostic"
            echo ""
            echo '```text'

            if [ -f filtered_build_errors.txt ]; then
              cat filtered_build_errors.txt
            elif [ -f ai_error_review.txt ]; then
              cat ai_error_review.txt
            elif [ -f build.log ]; then
              tail -n 250 build.log
            else
              echo "No diagnostic data available."
            fi

            echo '```'
            echo ""
            echo "## Privacy"
            echo ""
            echo "No external AI API was called."
            echo "This file is for manual review only."

          } > "$REVIEW_INPUT"

          if [ ! -s "$REVIEW_INPUT" ]; then

            echo "::error title=Review Input Failed::Review input is empty"

            exit 1

          fi

          echo "Action-ready review input created."


      # ============================================================
      # 24. FINAL DIAGNOSTIC SUMMARY
      # ============================================================

      - name: Show Final Diagnostic Summary
        if: failure()
        shell: bash
        run: |
          set +e

          echo "=================================================="
          echo "JULIE FINAL BUILD DIAGNOSTIC"
          echo "=================================================="

          if [ -f filtered_build_errors.txt ]; then

            echo ""
            echo "FILTERED BUILD ERRORS"
            echo "---------------------"

            cat filtered_build_errors.txt

          fi

          if [ -f ai_error_review.txt ]; then

            echo ""
            echo "MANUAL AI REVIEW PACKAGE"
            echo "------------------------"

            cat ai_error_review.txt

          fi

          if [ -f action_ready_ai_review.md ]; then

            echo ""
            echo "ACTION-READY REVIEW"
            echo "-------------------"

            cat action_ready_ai_review.md

          fi

          echo ""
          echo "=================================================="
          echo "END JULIE FINAL BUILD DIAGNOSTIC"
          echo "=================================================="


      # ============================================================
      # 25. UPLOAD BUILD DIAGNOSTICS
      # ============================================================

      - name: Upload Build Diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: JULIE_AI_OS_Build59_Diagnostics
          path: |
            build.log
            filtered_build_errors.txt
            ai_error_review.txt
            action_ready_ai_review.md
            buildozer.spec
            .github/problem-matchers/julie-build.json
          if-no-files-found: ignore
          retention-days: 14


      # ============================================================
      # 26. LIST APK
      # ============================================================

      - name: List APK
        if: success()
        shell: bash
        run: |
          set -e

          echo "=================================================="
          echo "GENERATED APK FILES"
          echo "=================================================="

          if [ ! -d bin ]; then

            echo "ERROR: bin directory was not created."

            exit 1

          fi

          APK_COUNT=$(
            find bin \
              -maxdepth 1 \
              -type f \
              -name "*.apk" \
              | wc -l
          )

          if [ "$APK_COUNT" -eq 0 ]; then

            echo "::error title=APK Missing::No APK file was generated."

            exit 1

          fi

          echo "APK count: $APK_COUNT"
          echo ""

          find bin \
            -maxdepth 1 \
            -type f \
            -name "*.apk" \
            -print \
            -exec ls -lh {} \;


      # ============================================================
      # 27. UPLOAD APK
      # ============================================================

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: JULIE_AI_OS_Build59_Accessibility
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 14