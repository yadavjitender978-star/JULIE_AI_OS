name: JULIE AI OS - Build 59 Accessibility

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-accessibility:
    name: Build JULIE AI OS Accessibility APK
    runs-on: ubuntu-22.04

    steps:

      # ------------------------------------------------------------
      # 1. CHECKOUT
      # ------------------------------------------------------------
      - name: Checkout Build 59 Accessibility
        uses: actions/checkout@v4
        with:
          ref: build-59-accessibility
          fetch-depth: 0

      # ------------------------------------------------------------
      # 2. PYTHON
      # ------------------------------------------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ------------------------------------------------------------
      # 3. JAVA
      # ------------------------------------------------------------
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ------------------------------------------------------------
      # 4. ANDROID / BUILD DEPENDENCIES
      # ------------------------------------------------------------
      - name: Install Android Build Dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            autopoint \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            cmake \
            libffi-dev \
            libssl-dev \
            build-essential

      # ------------------------------------------------------------
      # 5. BUILD TOOLS
      # ------------------------------------------------------------
      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel virtualenv
          python -m pip install buildozer
          python -m pip install "cython==0.29.36"

          buildozer --version
          python --version
          java -version

      # ------------------------------------------------------------
      # 6. VERIFY ACCESSIBILITY FILES
      # ------------------------------------------------------------
      - name: Verify Accessibility Integration
        shell: bash
        run: |
          set -e

          echo "=================================================="
          echo "JULIE ACCESSIBILITY FILE CHECK"
          echo "=================================================="

          REQUIRED_FILES=(
            "accessibility/__init__.py"
            "accessibility/accessibility_bridge.py"
            "accessibility/accessibility_service.py"
            "accessibility/accessibility_service_manifest.xml"
            "android_src/org/julie/ai/JulieAccessibilityService.java"
            "android_src/res/xml/julie_accessibility_service.xml"
            "android_src/res/values/strings.xml"
            "buildozer.spec"
            "main.py"
          )

          for FILE in "${REQUIRED_FILES[@]}"; do
            if [ ! -f "$FILE" ]; then
              echo ""
              echo "ERROR: Required file is missing:"
              echo "$FILE"
              exit 1
            fi

            echo "OK: $FILE"
          done

          echo ""
          echo "=================================================="
          echo "ACCESSIBILITY SERVICE JAVA"
          echo "=================================================="

          grep -n "class JulieAccessibilityService" \
            android_src/org/julie/ai/JulieAccessibilityService.java

          echo ""
          echo "=================================================="
          echo "ACCESSIBILITY RESOURCE"
          echo "=================================================="

          grep -n "julie_accessibility_description" \
            android_src/res/values/strings.xml

          echo ""
          echo "=================================================="
          echo "ACCESSIBILITY XML"
          echo "=================================================="

          grep -n "accessibility-service" \
            android_src/res/xml/julie_accessibility_service.xml

          echo ""
          echo "=================================================="
          echo "MANIFEST SERVICE"
          echo "=================================================="

          grep -n "JulieAccessibilityService" \
            accessibility/accessibility_service_manifest.xml

          grep -n "BIND_ACCESSIBILITY_SERVICE" \
            accessibility/accessibility_service_manifest.xml

          grep -n "android.accessibilityservice.AccessibilityService" \
            accessibility/accessibility_service_manifest.xml

      # ------------------------------------------------------------
      # 7. VALIDATE XML
      # ------------------------------------------------------------
      - name: Validate Accessibility XML
        shell: bash
        run: |
          set -e

          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          files = [
              Path("android_src/res/xml/julie_accessibility_service.xml"),
              Path("android_src/res/values/strings.xml"),
              Path("accessibility/accessibility_service_manifest.xml"),
          ]

          for path in files:
              print(f"Checking XML: {path}")
              ET.parse(path)
              print(f"OK: {path}")

          print("All Accessibility XML files are valid.")
          PY

      # ------------------------------------------------------------
      # 8. VALIDATE JAVA
      # ------------------------------------------------------------
      - name: Validate Java Source
        shell: bash
        run: |
          set -e

          JAVA_FILE="android_src/org/julie/ai/JulieAccessibilityService.java"

          echo "Checking Java source..."

          grep -q \
            "package org.julie.ai;" \
            "$JAVA_FILE"

          grep -q \
            "extends AccessibilityService" \
            "$JAVA_FILE"

          grep -q \
            "onAccessibilityEvent" \
            "$JAVA_FILE"

          grep -q \
            "onInterrupt" \
            "$JAVA_FILE"

          echo "Java Accessibility Service source validation passed."

      # ------------------------------------------------------------
      # 9. VALIDATE BUILD CONFIGURATION
      # ------------------------------------------------------------
      - name: Validate Buildozer Configuration
        shell: bash
        run: |
          set -e

          echo "=================================================="
          echo "BUILD CONFIGURATION"
          echo "=================================================="

          grep -n "^requirements" buildozer.spec || true
          grep -n "^android.permissions" buildozer.spec || true
          grep -n "^android.add_src" buildozer.spec || true
          grep -n "^android.res_xml" buildozer.spec || true
          grep -n "^android.add_resources" buildozer.spec || true
          grep -n "^android.extra_manifest_application_xml" buildozer.spec || true

          echo ""
          echo "Checking required Accessibility configuration..."

          grep -q \
            "BIND_ACCESSIBILITY_SERVICE" \
            buildozer.spec

          grep -q \
            "android_src" \
            buildozer.spec

          grep -q \
            "android.extra_manifest_application_xml" \
            buildozer.spec

          echo "Buildozer Accessibility configuration detected."

      # ------------------------------------------------------------
      # 10. NORMALIZE BUILD CONFIGURATION
      # ------------------------------------------------------------
      - name: Configure Accessibility Resources
        shell: bash
        run: |
          set -e

          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("buildozer.spec")
          text = path.read_text(encoding="utf-8")

          def set_option(text, key, value):
              pattern = rf"(?m)^[ \t]*{re.escape(key)}[ \t]*=.*$"
              replacement = f"{key} = {value}"

              if re.search(pattern, text):
                  return re.sub(pattern, replacement, text)

              app_match = re.search(r"(?m)^\[app\][ \t]*$", text)

              if not app_match:
                  raise RuntimeError("[app] section not found")

              insert_at = app_match.end()

              return (
                  text[:insert_at]
                  + "\n"
                  + replacement
                  + text[insert_at:]
              )

          # Keep the Android module explicitly available.
          text = set_option(
              text,
              "requirements",
              "python3,kivy,pyjnius,android"
          )

          # Accessibility permission.
          text = set_option(
              text,
              "android.permissions",
              "INTERNET,RECORD_AUDIO,MODIFY_AUDIO_SETTINGS,BIND_ACCESSIBILITY_SERVICE"
          )

          # Java source directory.
          text = set_option(
              text,
              "android.add_src",
              "android_src"
          )

          # Accessibility XML copied to res/xml.
          text = set_option(
              text,
              "android.res_xml",
              "android_src/res/xml/julie_accessibility_service.xml"
          )

          # IMPORTANT:
          # Add the complete Android resource tree.
          # This includes:
          #   res/values/strings.xml
          #   res/xml/julie_accessibility_service.xml
          text = set_option(
              text,
              "android.add_resources",
              "android_src/res"
          )

          # Service declaration inside <application>.
          text = set_option(
              text,
              "android.extra_manifest_application_xml",
              "accessibility/accessibility_service_manifest.xml"
          )

          path.write_text(text, encoding="utf-8")

          print("Updated buildozer.spec:")
          print("----------------------------------------")
          print(text)
          print("----------------------------------------")
          PY

      # ------------------------------------------------------------
      # 11. SHOW FINAL FILE TREE
      # ------------------------------------------------------------
      - name: Show Accessibility File Tree
        shell: bash
        run: |
          echo "=================================================="
          echo "ACCESSIBILITY TREE"
          echo "=================================================="

          find accessibility android_src \
            -type f \
            -print \
            | sort

      # ------------------------------------------------------------
      # 12. SHOW FINAL BUILD CONFIGURATION
      # ------------------------------------------------------------
      - name: Show Final Build Configuration
        shell: bash
        run: |
          echo "=================================================="
          echo "FINAL BUILDOZER SPEC"
          echo "=================================================="

          cat buildozer.spec

      # ------------------------------------------------------------
      # 13. CHECK GIT CHANGES
      # ------------------------------------------------------------
      - name: Check Git Changes
        shell: bash
        run: |
          echo "=================================================="
          echo "GIT STATUS"
          echo "=================================================="

          git status --short

      # ------------------------------------------------------------
      # 14. COMMIT ONLY BUILD CONFIGURATION CHANGES
      # ------------------------------------------------------------
      - name: Commit Build Configuration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add buildozer.spec

          if git diff --cached --quiet; then
            echo "No build configuration changes to commit."
          else
            git commit -m "Build 59: configure Accessibility resources"
          fi

      # ------------------------------------------------------------
      # 15. PUSH CONFIGURATION
      # ------------------------------------------------------------
      - name: Push Build Configuration
        shell: bash
        run: |
          git push origin HEAD:build-59-accessibility

      # ------------------------------------------------------------
      # 16. CLEAN OLD BUILD OUTPUT
      # ------------------------------------------------------------
      - name: Clean Previous Build
        shell: bash
        run: |
          rm -rf .buildozer bin

          echo "Previous Buildozer output removed."

      # ------------------------------------------------------------
      # 17. BUILD APK
      # ------------------------------------------------------------
      - name: Build APK
        shell: bash
        run: |
          set -o pipefail

          yes | buildozer -v android debug 2>&1 | tee build.log

      # ------------------------------------------------------------
      # 18. EXTRACT IMPORTANT ERRORS
      # ------------------------------------------------------------
      - name: Extract Build Errors
        if: failure()
        shell: bash
        run: |
          echo ""
          echo "=================================================="
          echo "IMPORTANT BUILD ERRORS"
          echo "=================================================="

          if [ -f build.log ]; then

            grep -n -E \
              "FAILURE:|ERROR:|AAPT:|Manifest merger failed|Execution failed|Caused by:|Could not find|No matching distribution|resource .* not found|error:" \
              build.log \
              | tail -n 100 \
              || true

          else
            echo "build.log was not created."
          fi

      # ------------------------------------------------------------
      # 19. VERIFY GENERATED APK
      # ------------------------------------------------------------
      - name: List APK
        if: success()
        shell: bash
        run: |
          echo "=================================================="
          echo "GENERATED APK FILES"
          echo "=================================================="

          find bin \
            -maxdepth 1 \
            -type f \
            -name "*.apk" \
            -print \
            -exec ls -lh {} \;

      # ------------------------------------------------------------
      # 20. UPLOAD APK
      # ------------------------------------------------------------
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: JULIE_AI_OS_Build59_Accessibility
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 14

      # ------------------------------------------------------------
      # 21. UPLOAD BUILD LOG ON FAILURE
      # ------------------------------------------------------------
      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: JULIE_AI_OS_Build59_BuildLog
          path: |
            build.log
            buildozer.spec
          if-no-files-found: ignore
          retention-days: 14