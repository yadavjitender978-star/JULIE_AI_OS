name: JULIE AI OS - Build 59 Accessibility

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:

  build-accessibility:

    name: Build JULIE AI OS Accessibility APK

    runs-on: ubuntu-22.04

    steps:

      - name: Checkout Build 59 Accessibility
        uses: actions/checkout@v4
        with:
          ref: build-59-accessibility

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android Build Dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            cmake \
            libffi-dev \
            libssl-dev

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install buildozer
          python -m pip install "cython==0.29.36"
          python -m pip install virtualenv setuptools wheel

      - name: Create Accessibility Directories
        run: |
          mkdir -p accessibility
          mkdir -p android_src/org/julie/ai
          mkdir -p android_src/res/xml
          mkdir -p android_src/res/values

      - name: Create Python Accessibility Package
        run: |

          cat > accessibility/__init__.py <<'PY'
          """
          JULIE AI OS Accessibility package.

          Build 59.
          """
          PY


          cat > accessibility/accessibility_service.py <<'PY'
          """
          JULIE AI OS Accessibility Controller.

          Build 59.
          """

          from __future__ import annotations

          import logging


          LOGGER = logging.getLogger(
              "julie.accessibility"
          )


          class AccessibilityController:

              def __init__(self) -> None:
                  self._enabled = False
                  self._connected = False

              def set_enabled(
                  self,
                  enabled: bool
              ) -> None:

                  self._enabled = bool(enabled)

                  LOGGER.info(
                      "Accessibility enabled=%s",
                      self._enabled
                  )

              def set_connected(
                  self,
                  connected: bool
              ) -> None:

                  self._connected = bool(connected)

                  LOGGER.info(
                      "Accessibility connected=%s",
                      self._connected
                  )

              @property
              def enabled(self) -> bool:
                  return self._enabled

              @property
              def connected(self) -> bool:
                  return self._connected

              def status(self) -> dict[str, bool]:
                  return {
                      "enabled": self._enabled,
                      "connected": self._connected,
                  }


          _controller = None


          def get_controller() -> AccessibilityController:

              global _controller

              if _controller is None:
                  _controller = AccessibilityController()

              return _controller
          PY


          cat > accessibility/accessibility_bridge.py <<'PY'
          """
          JULIE AI OS Accessibility JNI Bridge.

          Build 59.
          """

          from __future__ import annotations

          import logging
          from typing import Any, Optional


          LOGGER = logging.getLogger(
              "julie.accessibility.bridge"
          )


          class AccessibilityBridge:

              def __init__(self) -> None:
                  self._service: Optional[Any] = None

              def initialize(self) -> bool:

                  try:

                      from jnius import autoclass

                      service_class = autoclass(
                          "org.julie.ai.JulieAccessibilityService"
                      )

                      service = service_class.getInstance()

                      if service is None:
                          self._service = None
                          return False

                      self._service = service
                      return True

                  except Exception as exc:

                      LOGGER.debug(
                          "Accessibility service unavailable: %s",
                          exc
                      )

                      self._service = None
                      return False

              def is_available(self) -> bool:
                  return self._service is not None

              def is_service_running(self) -> bool:

                  if self._service is None:
                      return False

                  try:
                      return bool(
                          self._service.isServiceRunning()
                      )
                  except Exception:
                      return False

              def get_service(self) -> Optional[Any]:
                  return self._service
          PY

      - name: Create Native Accessibility Service
        run: |

          cat > android_src/org/julie/ai/JulieAccessibilityService.java <<'JAVA'
          package org.julie.ai;

          import android.accessibilityservice.AccessibilityService;
          import android.view.accessibility.AccessibilityEvent;
          import android.view.accessibility.AccessibilityNodeInfo;
          import android.util.Log;


          public class JulieAccessibilityService
                  extends AccessibilityService {

              private static final String TAG =
                      "JULIE_ACCESSIBILITY";

              private static JulieAccessibilityService instance;


              public static synchronized
              JulieAccessibilityService getInstance() {

                  return instance;
              }


              @Override
              protected void onServiceConnected() {

                  super.onServiceConnected();

                  instance = this;

                  Log.i(
                      TAG,
                      "JULIE Accessibility Service CONNECTED"
                  );
              }


              @Override
              public void onAccessibilityEvent(
                      AccessibilityEvent event) {

                  if (event == null) {
                      return;
                  }

                  int eventType =
                          event.getEventType();

                  CharSequence packageName =
                          event.getPackageName();

                  CharSequence className =
                          event.getClassName();

                  Log.d(
                      TAG,
                      "eventType=" + eventType
                      + " package=" + packageName
                      + " class=" + className
                  );
              }


              @Override
              public void onInterrupt() {

                  Log.w(
                      TAG,
                      "JULIE Accessibility Service INTERRUPTED"
                  );
              }


              @Override
              public void onDestroy() {

                  Log.i(
                      TAG,
                      "JULIE Accessibility Service DESTROYED"
                  );

                  if (instance == this) {
                      instance = null;
                  }

                  super.onDestroy();
              }


              public boolean isServiceRunning() {

                  return instance != null;
              }


              public AccessibilityNodeInfo
              getActiveWindowRoot() {

                  try {
                      return getRootInActiveWindow();

                  } catch (Exception e) {

                      Log.e(
                          TAG,
                          "Unable to get active window root",
                          e
                      );

                      return null;
                  }
              }
          }
          JAVA

      - name: Create Accessibility XML
        run: |

          cat > android_src/res/xml/julie_accessibility_service.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>

          <accessibility-service
              xmlns:android="http://schemas.android.com/apk/res/android"

              android:accessibilityEventTypes="
                  typeViewClicked|
                  typeViewFocused|
                  typeViewTextChanged|
                  typeWindowStateChanged|
                  typeWindowContentChanged|
                  typeViewScrolled
              "

              android:accessibilityFeedbackType="feedbackGeneric"

              android:notificationTimeout="100"

              android:canRetrieveWindowContent="true"

              android:canPerformGestures="true"

              android:description="@string/julie_accessibility_description"

          />
          XML

      - name: Create Android Strings
        run: |

          cat > android_src/res/values/strings.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>

          <resources>

              <string name="app_name">
                  JULIE AI OS
              </string>

              <string name="julie_accessibility_description">
                  JULIE AI OS Accessibility Service for screen understanding and user interface interaction.
              </string>

          </resources>
          XML

      - name: Create Accessibility Manifest Declaration
        run: |

          cat > accessibility/accessibility_service_manifest.xml <<'XML'
          <service
              android:name="org.julie.ai.JulieAccessibilityService"
              android:label="JULIE AI OS"
              android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
              android:exported="true">

              <intent-filter>

                  <action
                      android:name="android.accessibilityservice.AccessibilityService" />

              </intent-filter>

              <meta-data
                  android:name="android.accessibilityservice"
                  android:resource="@xml/julie_accessibility_service" />

          </service>
          XML

      - name: Update Buildozer Configuration
        run: |

          python - <<'PY'

          from pathlib import Path

          path = Path("buildozer.spec")

          text = path.read_text(
              encoding="utf-8"
          )

          additions = [
              "android.add_src = android_src",
              "android.res_xml = android_src/res/xml/julie_accessibility_service.xml",
              "android.extra_manifest_application_xml = accessibility/accessibility_service_manifest.xml",
          ]

          for line in additions:

              key = line.split("=", 1)[0].strip()

              exists = any(
                  item.strip().startswith(key + " =")
                  for item in text.splitlines()
              )

              if not exists:
                  text = text.rstrip() + "\n" + line + "\n"

          path.write_text(
              text,
              encoding="utf-8"
          )

          print(path.read_text())

          PY

      - name: Verify Existing JULIE Core Was Not Changed
        run: |

          echo "Checking main.py..."
          git status --short -- main.py

          echo "Checking voice..."
          git status --short -- voice

          echo "Checking accessibility..."
          find accessibility -type f -print

          echo "Checking native Android source..."
          find android_src -type f -print

      - name: Commit Accessibility Integration
        run: |

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            accessibility \
            android_src \
            buildozer.spec

          git diff --cached --quiet || \
            git commit -m "Build 59: add Android Accessibility Service"

      - name: Push Accessibility Integration
        run: |

          git push origin HEAD:build-59-accessibility

      - name: Build APK
        run: |

          yes | buildozer -v android debug

      - name: List APK
        run: |

          echo "Generated APK files:"

          find bin \
            -maxdepth 1 \
            -type f \
            -name "*.apk" \
            -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JULIE_AI_OS_Build59_Accessibility
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 14