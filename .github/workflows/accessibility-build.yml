name: JULIE AI OS - Build 59 Accessibility

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build-accessibility:
    name: Build JULIE AI OS Accessibility APK
    runs-on: ubuntu-22.04

    steps:

      # ------------------------------------------------------------
      # 1. CHECKOUT
      # ------------------------------------------------------------
      - name: Checkout Build 59 Accessibility
        uses: actions/checkout@v4
        with:
          ref: build-59-accessibility
          fetch-depth: 0

      # ------------------------------------------------------------
      # 2. SETUP PYTHON
      # ------------------------------------------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ------------------------------------------------------------
      # 3. SETUP JAVA 17
      # ------------------------------------------------------------
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ------------------------------------------------------------
      # 4. ANDROID / BUILD DEPENDENCIES
      # ------------------------------------------------------------
      - name: Install Android Build Dependencies
        shell: bash
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            autopoint \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            cmake \
            libffi-dev \
            libssl-dev \
            build-essential

      # ------------------------------------------------------------
      # 5. INSTALL BUILDOZER
      # ------------------------------------------------------------
      - name: Install Buildozer
        shell: bash
        run: |
          set -e

          python -m pip install --upgrade \
            pip \
            setuptools \
            wheel \
            virtualenv

          python -m pip install buildozer
          python -m pip install "cython==0.29.36"

          echo "=================================================="
          echo "BUILD TOOLS"
          echo "=================================================="

          echo "Buildozer:"
          buildozer --version

          echo ""
          echo "Python:"
          python --version

          echo ""
          echo "Java:"
          java -version

      # ------------------------------------------------------------
      # 6. VERIFY ACCESSIBILITY FILES
      # ------------------------------------------------------------
      - name: Verify Accessibility Integration
        shell: bash
        run: |
          set -e

          echo "=================================================="
          echo "JULIE ACCESSIBILITY FILE CHECK"
          echo "=================================================="

          REQUIRED_FILES=(
            "accessibility/__init__.py"
            "accessibility/accessibility_bridge.py"
            "accessibility/accessibility_service.py"
            "accessibility/accessibility_service_manifest.xml"
            "android_src/org/julie/ai/JulieAccessibilityService.java"
            "android_src/res/xml/julie_accessibility_service.xml"
            "android_src/res/values/strings.xml"
            "buildozer.spec"
            "main.py"
          )

          for FILE in "${REQUIRED_FILES[@]}"; do
            if [ ! -f "$FILE" ]; then
              echo ""
              echo "::error title=Missing Accessibility File::$FILE"
              exit 1
            fi

            echo "OK: $FILE"
          done

          echo ""
          echo "=================================================="
          echo "ACCESSIBILITY SERVICE JAVA"
          echo "=================================================="

          grep -n \
            "class JulieAccessibilityService" \
            android_src/org/julie/ai/JulieAccessibilityService.java

          echo ""
          echo "=================================================="
          echo "ACCESSIBILITY RESOURCE STRING"
          echo "=================================================="

          grep -n \
            "julie_accessibility_description" \
            android_src/res/values/strings.xml

          echo ""
          echo "=================================================="
          echo "ACCESSIBILITY XML"
          echo "=================================================="

          grep -n \
            "accessibility-service" \
            android_src/res/xml/julie_accessibility_service.xml

          echo ""
          echo "=================================================="
          echo "ACCESSIBILITY MANIFEST SERVICE"
          echo "=================================================="

          grep -n \
            "JulieAccessibilityService" \
            accessibility/accessibility_service_manifest.xml

          grep -n \
            "BIND_ACCESSIBILITY_SERVICE" \
            accessibility/accessibility_service_manifest.xml

          grep -n \
            "android.accessibilityservice.AccessibilityService" \
            accessibility/accessibility_service_manifest.xml

          echo ""
          echo "Accessibility integration files are present."

      # ------------------------------------------------------------
      # 7. VALIDATE ACCESSIBILITY RESOURCE XML
      # ------------------------------------------------------------
      - name: Validate Accessibility Resource XML
        shell: bash
        run: |
          set -e

          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          resource_files = [
              Path("android_src/res/xml/julie_accessibility_service.xml"),
              Path("android_src/res/values/strings.xml"),
          ]

          for path in resource_files:
              print(f"Checking Android resource XML: {path}")
              ET.parse(path)
              print(f"OK: {path}")

          print("")
          print("Accessibility resource XML validation passed.")
          PY

      # ------------------------------------------------------------
      # 8. VALIDATE ACCESSIBILITY MANIFEST FRAGMENT
      # ------------------------------------------------------------
      - name: Validate Accessibility Manifest Fragment
        shell: bash
        run: |
          set -e

          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          manifest_fragment = Path(
              "accessibility/accessibility_service_manifest.xml"
          )

          fragment = manifest_fragment.read_text(
              encoding="utf-8"
          ).strip()

          if not fragment:
              raise RuntimeError(
                  "Accessibility manifest fragment is empty."
              )

          if "<service" not in fragment:
              raise RuntimeError(
                  "Accessibility manifest fragment does not contain <service>."
              )

          wrapper = f"""
          <application
              xmlns:android="http://schemas.android.com/apk/res/android">
              {fragment}
          </application>
          """

          ET.fromstring(wrapper)

          print(
              "OK: accessibility/accessibility_service_manifest.xml"
          )

          print(
              "Accessibility manifest fragment validation passed."
          )
          PY

      # ------------------------------------------------------------
      # 9. VALIDATE JAVA
      # ------------------------------------------------------------
      - name: Validate Java Source
        shell: bash
        run: |
          set -e

          JAVA_FILE="android_src/org/julie/ai/JulieAccessibilityService.java"

          echo "Checking Java source..."

          grep -q \
            "package org.julie.ai;" \
            "$JAVA_FILE"

          grep -q \
            "extends AccessibilityService" \
            "$JAVA_FILE"

          grep -q \
            "onServiceConnected" \
            "$JAVA_FILE"

          grep -q \
            "onAccessibilityEvent" \
            "$JAVA_FILE"

          grep -q \
            "onInterrupt" \
            "$JAVA_FILE"

          grep -q \
            "onDestroy" \
            "$JAVA_FILE"

          echo "Java Accessibility Service source validation passed."

      # ------------------------------------------------------------
      # 10. VALIDATE BUILD CONFIGURATION
      # ------------------------------------------------------------
      - name: Validate Buildozer Configuration
        shell: bash
        run: |
          set -e

          echo "=================================================="
          echo "BUILD CONFIGURATION"
          echo "=================================================="

          grep -n "^requirements" buildozer.spec || true
          grep -n "^android.api" buildozer.spec || true
          grep -n "^android.minapi" buildozer.spec || true
          grep -n "^android.ndk_api" buildozer.spec || true
          grep -n "^android.archs" buildozer.spec || true
          grep -n "^android.permissions" buildozer.spec || true
          grep -n "^android.add_src" buildozer.spec || true
          grep -n "^android.res_xml" buildozer.spec || true
          grep -n "^android.add_resources" buildozer.spec || true
          grep -n "^android.extra_manifest_application_xml" buildozer.spec || true

          echo ""
          echo "Checking required Accessibility configuration..."

          grep -q \
            "BIND_ACCESSIBILITY_SERVICE" \
            buildozer.spec

          grep -q \
            "android_src" \
            buildozer.spec

          grep -q \
            "android.extra_manifest_application_xml" \
            buildozer.spec

          echo ""
          echo "Buildozer Accessibility configuration detected."

      # ------------------------------------------------------------
      # 11. CONFIGURE ACCESSIBILITY RESOURCES
      # ------------------------------------------------------------
      - name: Configure Accessibility Resources
        shell: bash
        run: |
          set -e

          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("buildozer.spec")
          text = path.read_text(encoding="utf-8")

          def set_option(text, key, value):
              pattern = (
                  rf"(?m)^[ \t]*{re.escape(key)}[ \t]*=.*$"
              )

              replacement = f"{key} = {value}"

              if re.search(pattern, text):
                  return re.sub(
                      pattern,
                      replacement,
                      text
                  )

              app_match = re.search(
                  r"(?m)^\[app\][ \t]*$",
                  text
              )

              if not app_match:
                  raise RuntimeError(
                      "[app] section not found in buildozer.spec"
                  )

              insert_at = app_match.end()

              return (
                  text[:insert_at]
                  + "\n"
                  + replacement
                  + text[insert_at:]
              )

          text = set_option(
              text,
              "requirements",
              "python3,kivy,pyjnius,android"
          )

          text = set_option(
              text,
              "android.permissions",
              "INTERNET,RECORD_AUDIO,MODIFY_AUDIO_SETTINGS,BIND_ACCESSIBILITY_SERVICE"
          )

          text = set_option(
              text,
              "android.add_src",
              "android_src"
          )

          text = set_option(
              text,
              "android.res_xml",
              "android_src/res/xml/julie_accessibility_service.xml"
          )

          text = set_option(
              text,
              "android.add_resources",
              "android_src/res"
          )

          text = set_option(
              text,
              "android.extra_manifest_application_xml",
              "accessibility/accessibility_service_manifest.xml"
          )

          path.write_text(
              text,
              encoding="utf-8"
          )

          print("")
          print("Updated buildozer.spec:")
          print("==================================================")
          print(text)
          print("==================================================")
          PY

      # ------------------------------------------------------------
      # 12. SHOW ACCESSIBILITY FILE TREE
      # ------------------------------------------------------------
      - name: Show Accessibility File Tree
        shell: bash
        run: |
          set -e

          echo "=================================================="
          echo "ACCESSIBILITY TREE"
          echo "=================================================="

          find accessibility android_src \
            -type f \
            -print \
            | sort

      # ------------------------------------------------------------
      # 13. SHOW FINAL BUILD CONFIGURATION
      # ------------------------------------------------------------
      - name: Show Final Build Configuration
        shell: bash
        run: |
          set -e

          echo "=================================================="
          echo "FINAL BUILDOZER SPEC"
          echo "=================================================="

          cat buildozer.spec

      # ------------------------------------------------------------
      # 14. CHECK GIT CHANGES
      # ------------------------------------------------------------
      - name: Check Git Changes
        shell: bash
        run: |
          echo "=================================================="
          echo "GIT STATUS"
          echo "=================================================="

          git status --short

      # ------------------------------------------------------------
      # 15. COMMIT BUILD CONFIGURATION
      # ------------------------------------------------------------
      - name: Commit Build Configuration
        shell: bash
        run: |
          set -e

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add buildozer.spec

          if git diff --cached --quiet; then
            echo "No build configuration changes to commit."
          else
            git commit \
              -m "Build 59: configure Accessibility resources"
          fi

      # ------------------------------------------------------------
      # 16. PUSH CONFIGURATION
      # ------------------------------------------------------------
      - name: Push Build Configuration
        shell: bash
        run: |
          set -e

          git push \
            origin \
            HEAD:build-59-accessibility

      # ------------------------------------------------------------
      # 17. CREATE JULIE PROBLEM MATCHER
      # ------------------------------------------------------------
      - name: Create JULIE Problem Matcher
        shell: bash
        run: |
          set -e

          mkdir -p .github/problem-matchers

          cat > .github/problem-matchers/julie-build.json <<'JSON'
          {
            "problemMatcher": [
              {
                "owner": "julie-build",
                "severity": "error",
                "pattern": [
                  {
                    "regexp": "^.*?([^\\s]+\\.(?:py|java|xml|kt|gradle|spec)):(\\d+):(?:\\s*\\d+:)?\\s*(?:AAPT:\\s*)?(?:error:|ERROR:)?\\s*(.*)$",
                    "file": 1,
                    "line": 2,
                    "message": 3
                  }
                ]
              }
            ]
          }
          JSON

          echo "=================================================="
          echo "JULIE PROBLEM MATCHER"
          echo "=================================================="

          cat .github/problem-matchers/julie-build.json

          echo ""
          echo "Problem Matcher definition created."

      # ------------------------------------------------------------
      # 18. ACTIVATE JULIE PROBLEM MATCHER
      # ------------------------------------------------------------
      - name: Activate JULIE Problem Matcher
        shell: bash
        run: |
          set -e

          echo "::add-matcher::.github/problem-matchers/julie-build.json"

          echo "=================================================="
          echo "JULIE PROBLEM MATCHER ACTIVE"
          echo "=================================================="

          echo "JULIE Problem Matcher is now active."
          echo "Matching build errors will be annotated by GitHub."

      # ------------------------------------------------------------
      # 19. CLEAN OLD BUILD OUTPUT
      # ------------------------------------------------------------
      - name: Clean Previous Build
        shell: bash
        run: |
          set -e

          rm -rf .buildozer
          rm -rf bin

          echo "Previous Buildozer output removed."

      # ------------------------------------------------------------
      # 20. BUILD APK
      # ------------------------------------------------------------
      - name: Build APK
        shell: bash
        run: |
          set -o pipefail

          yes | buildozer -v android debug 2>&1 | tee build.log

      # ------------------------------------------------------------
      # 21. REMOVE JULIE PROBLEM MATCHER
      # ------------------------------------------------------------
      - name: Remove JULIE Problem Matcher
        if: always()
        shell: bash
        run: |
          set +e

          echo "::remove-matcher owner=julie-build::"

          echo "JULIE Problem Matcher removed after build."

      # ------------------------------------------------------------
      # 22. EXTRACT AND ANNOTATE BUILD ERRORS
      # ------------------------------------------------------------
      - name: Extract and Annotate Build Errors
        if: failure()
        shell: bash
        run: |
          set +e

          echo "=================================================="
          echo "JULIE AI OS BUILD DIAGNOSTIC"
          echo "=================================================="

          LOG_FILE="build.log"

          if [ ! -f "$LOG_FILE" ]; then
            echo "::error title=JULIE Build Failed::build.log was not created"

            {
              echo "## 🚨 JULIE AI OS Build Error"
              echo ""
              echo "build.log was not created."
              echo ""
              echo "The build failed before the build log could be captured."
            } >> "$GITHUB_STEP_SUMMARY"

            exit 0
          fi

          echo ""
          echo "Scanning build log..."

          MATCHED_ERRORS=$(
            grep -n -E \
              "FAILURE:|AAPT:|Manifest merger failed|Execution failed for task|Caused by:|Could not find|No matching distribution found|resource .* not found|error:|ERROR:" \
              "$LOG_FILE" \
              | tail -n 100
          )

          if [ -z "$MATCHED_ERRORS" ]; then
            MATCHED_ERRORS=$(
              tail -n 150 "$LOG_FILE"
            )
          fi

          echo ""
          echo "=================================================="
          echo "IMPORTANT ERRORS"
          echo "=================================================="

          echo "$MATCHED_ERRORS"

          ROOT_ERROR=$(
            echo "$MATCHED_ERRORS" \
              | grep -E \
                "AAPT:|Manifest merger failed|Execution failed for task|No matching distribution found|Could not find|Caused by:|resource .* not found|error:|ERROR:" \
              | head -n 1
          )

          if [ -z "$ROOT_ERROR" ]; then
            ROOT_ERROR="Build failed. See diagnostic output below."
          fi

          SAFE_ROOT_ERROR=$(
            echo "$ROOT_ERROR" \
              | sed \
                's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g'
          )

          echo "::error title=JULIE AI OS Build Failed::$SAFE_ROOT_ERROR"

          {
            echo "## 🚨 JULIE AI OS Build Failed"
            echo ""
            echo "**Root error:**"
            echo ""
            echo '```text'
            echo "$ROOT_ERROR"
            echo '```'
            echo ""
            echo "**Relevant build diagnostics:**"
            echo ""
            echo '```text'
            echo "$MATCHED_ERRORS"
            echo '```'
            echo ""
            echo "**Privacy:**"
            echo ""
            echo "These diagnostics were generated locally inside GitHub Actions."
            echo "No external AI API was called."
            echo "No OpenAI API was called."
            echo "No Gemini API was called."
          } >> "$GITHUB_STEP_SUMMARY"

          {
            echo "JULIE AI OS BUILD DIAGNOSTIC"
            echo "============================"
            echo ""
            echo "ROOT ERROR:"
            echo "$ROOT_ERROR"
            echo ""
            echo "RELEVANT ERRORS:"
            echo "$MATCHED_ERRORS"
          } > filtered_build_errors.txt

          echo ""
          echo "Diagnostic extraction completed."

      # ------------------------------------------------------------
      # 23. PREPARE MANUAL AI REVIEW PACKAGE
      # ------------------------------------------------------------
      - name: Prepare Manual AI Review Package
        if: failure()
        shell: bash
        run: |
          set +e

          echo "=================================================="
          echo "JULIE MANUAL AI REVIEW PACKAGE"
          echo "=================================================="

          REVIEW_FILE="ai_error_review.txt"

          {
            echo "JULIE AI OS - BUILD ERROR REVIEW"
            echo "================================="
            echo ""
            echo "Workflow: $GITHUB_WORKFLOW"
            echo "Run: $GITHUB_RUN_NUMBER"
            echo "Branch: $GITHUB_REF_NAME"
            echo "Commit: $GITHUB_SHA"
            echo ""
            echo "This diagnostic was generated locally inside GitHub Actions."
            echo ""
            echo "IMPORTANT PRIVACY INFORMATION"
            echo "------------------------------"
            echo "No OpenAI API request was performed."
            echo "No Gemini API request was performed."
            echo "No external AI service was contacted."
            echo ""
            echo "ROOT / IMPORTANT BUILD ERRORS"
            echo "------------------------------"

            if [ -f filtered_build_errors.txt ]; then
              cat filtered_build_errors.txt
            elif [ -f build.log ]; then
              tail -n 150 build.log
            else
              echo "No build diagnostic file was available."
            fi

            echo ""
            echo "END OF REVIEW PACKAGE"

          } > "$REVIEW_FILE"

          echo "Manual AI review package created: $REVIEW_FILE"

          {
            echo ""
            echo "## 🤖 Manual AI Review Package"
            echo ""
            echo "A diagnostic package has been prepared for manual copy/paste."
            echo ""
            echo '```text'

            if [ -f "$REVIEW_FILE" ]; then
              cat "$REVIEW_FILE"
            fi

            echo '```'
            echo ""
            echo "**Privacy:**"
            echo ""
            echo "No OpenAI API call was performed."
            echo "No Gemini API call was performed."
            echo "No external AI service was contacted."
            echo ""
            echo "The diagnostic can be manually copied to ChatGPT or Gemini."
          } >> "$GITHUB_STEP_SUMMARY"

      # ------------------------------------------------------------
      # 24. PREPARE ACTION-READY AI REVIEW INPUT
      # ------------------------------------------------------------
      - name: Prepare Action-Ready AI Review Input
        if: failure()
        shell: bash
        run: |
          set +e

          echo "=================================================="
          echo "JULIE AI OS ACTION-READY AI REVIEW INPUT"
          echo "=================================================="

          REVIEW_INPUT="action_ready_ai_review.md"

          {
            echo "# JULIE AI OS - Action-Ready Build Error Review"
            echo ""
            echo "## Purpose"
            echo ""
            echo "This file contains the build diagnostics prepared for manual AI analysis."
            echo "It does not send anything to an AI service."
            echo ""
            echo "## Build Context"
            echo ""
            echo "- Workflow: ${GITHUB_WORKFLOW}"
            echo "- Run: ${GITHUB_RUN_NUMBER}"
            echo "- Branch: ${GITHUB_REF_NAME}"
            echo "- Commit: ${GITHUB_SHA}"
            echo ""
            echo "## AI Analysis Instructions"
            echo ""
            echo "Analyze the JULIE AI OS build failure."
            echo ""
            echo "1. Identify the true root cause."
            echo "2. Separate the root cause from secondary errors."
            echo "3. Identify the exact file and line responsible when available."
            echo "4. Explain why the build failed."
            echo "5. Provide the exact production-safe fix."
            echo "6. Do not remove existing JULIE AI OS functionality."
            echo "7. Preserve the Accessibility integration."
            echo "8. Check whether the error is related to Python, Java, XML, Gradle, Android, Buildozer, manifest configuration, resources, or dependencies."
            echo "9. Provide complete replacement code when a file must be edited."
            echo "10. Do not suggest sending the diagnostic to an external API from this workflow."
            echo ""
            echo "## Diagnostic Data"
            echo ""
            echo '```text'

            if [ -f filtered_build_errors.txt ]; then
              cat filtered_build_errors.txt
            elif [ -f ai_error_review.txt ]; then
              cat ai_error_review.txt
            elif [ -f build.log ]; then
              tail -n 200 build.log
            else
              echo "No diagnostic file was available."
            fi

            echo '```'
            echo ""
            echo "## Privacy"
            echo ""
            echo "No OpenAI API call was performed."
            echo "No Gemini API call was performed."
            echo "No external AI service was contacted."
            echo ""
            echo "This file is intended for manual copy/paste only."
            echo ""
            echo "## End of Review Input"
          } > "$REVIEW_INPUT"

          echo ""
          echo "Action-ready review input created:"
          echo "$REVIEW_INPUT"

          if [ ! -s "$REVIEW_INPUT" ]; then
            echo "::error title=Action-Ready Review Failed::Review input file is empty"
            exit 1
          fi

          echo ""
          echo "Action-ready review input verification PASSED."

          {
            echo ""
            echo "## 🧠 Action-Ready AI Review Input"
            echo ""
            echo "Verification passed."
            echo ""
            echo "**File:** \`$REVIEW_INPUT\`"
            echo ""
            echo "**API status:**"
            echo ""
            echo "No external AI API was called."
            echo ""
            echo "The diagnostic is ready for manual copy/paste."
          } >> "$GITHUB_STEP_SUMMARY"

      # ------------------------------------------------------------
      # 25. SHOW FINAL DIAGNOSTIC SUMMARY
      # ------------------------------------------------------------
      - name: Show Final Diagnostic Summary
        if: failure()
        shell: bash
        run: |
          set +e

          echo "=================================================="
          echo "JULIE FINAL BUILD DIAGNOSTIC"
          echo "=================================================="

          if [ -f filtered_build_errors.txt ]; then
            echo ""
            echo "FILTERED BUILD ERRORS"
            echo "---------------------"
            cat filtered_build_errors.txt
          fi

          if [ -f ai_error_review.txt ]; then
            echo ""
            echo "MANUAL AI REVIEW PACKAGE"
            echo "------------------------"
            cat ai_error_review.txt
          fi

          if [ -f action_ready_ai_review.md ]; then
            echo ""
            echo "ACTION-READY MANUAL REVIEW INPUT"
            echo "--------------------------------"
            cat action_ready_ai_review.md
          fi

          echo ""
          echo "=================================================="
          echo "END JULIE FINAL BUILD DIAGNOSTIC"
          echo "=================================================="

      # ------------------------------------------------------------
      # 26. UPLOAD BUILD LOG + DIAGNOSTIC PACKAGES
      # ------------------------------------------------------------
      - name: Upload Build Diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: JULIE_AI_OS_Build59_Diagnostics
          path: |
            build.log
            filtered_build_errors.txt
            ai_error_review.txt
            action_ready_ai_review.md
            buildozer.spec
            .github/problem-matchers/julie-build.json
          if-no-files-found: ignore
          retention-days: 14

      # ------------------------------------------------------------
      # 27. LIST APK
      # ------------------------------------------------------------
      - name: List APK
        if: success()
        shell: bash
        run: |
          set -e

          echo "=================================================="
          echo "GENERATED APK FILES"
          echo "=================================================="

          if [ ! -d bin ]; then
            echo "ERROR: bin directory was not created."
            exit 1
          fi

          APK_COUNT=$(
            find bin \
              -maxdepth 1 \
              -type f \
              -name "*.apk" \
              | wc -l
          )

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "::error title=APK Missing::No APK file was generated."
            exit 1
          fi

          echo "APK count: $APK_COUNT"
          echo ""

          find bin \
            -maxdepth 1 \
            -type f \
            -name "*.apk" \
            -print \
            -exec ls -lh {} \;

      # ------------------------------------------------------------
      # 28. UPLOAD APK
      # ------------------------------------------------------------
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: JULIE_AI_OS_Build59_Accessibility
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 14