name: JULIE AI OS Diagnostic

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  diagnostic:
    name: JULIE Project Diagnostic
    runs-on: ubuntu-latest

    steps:
      - name: Checkout JULIE AI OS
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Create diagnostic directory
        run: mkdir -p diagnostic

      - name: Project structure report
        shell: bash
        run: |
          echo "# JULIE AI OS PROJECT DIAGNOSTIC" > diagnostic/project_report.md
          echo "" >> diagnostic/project_report.md
          echo "## Repository" >> diagnostic/project_report.md
          echo "- Repository: $GITHUB_REPOSITORY" >> diagnostic/project_report.md
          echo "- Branch: $GITHUB_REF_NAME" >> diagnostic/project_report.md
          echo "- Commit: $GITHUB_SHA" >> diagnostic/project_report.md
          echo "- Date: $(date -u)" >> diagnostic/project_report.md
          echo "" >> diagnostic/project_report.md

          echo "## Python Files" >> diagnostic/project_report.md
          find . -type f -name "*.py" \
            -not -path "./.git/*" \
            -not -path "./.github/*" \
            -print | sort >> diagnostic/project_report.md

          echo "" >> diagnostic/project_report.md
          echo "## Python File Sizes" >> diagnostic/project_report.md
          find . -type f -name "*.py" \
            -not -path "./.git/*" \
            -printf "%s bytes  %p\n" | sort -nr >> diagnostic/project_report.md

      - name: Python syntax check
        shell: bash
        run: |
          set +e

          echo "# PYTHON SYNTAX CHECK" > diagnostic/python_syntax.md
          echo "" >> diagnostic/python_syntax.md

          ERROR_COUNT=0

          while IFS= read -r file; do
            if python -m py_compile "$file" 2>> diagnostic/syntax_errors.tmp; then
              echo "PASS: $file" >> diagnostic/python_syntax.md
            else
              echo "FAIL: $file" >> diagnostic/python_syntax.md
              ERROR_COUNT=$((ERROR_COUNT + 1))
            fi
          done < <(find . -type f -name "*.py" -not -path "./.git/*")

          echo "" >> diagnostic/python_syntax.md
          echo "Syntax error files: $ERROR_COUNT" >> diagnostic/python_syntax.md

          if [ "$ERROR_COUNT" -gt 0 ]; then
            echo "" >> diagnostic/python_syntax.md
            echo "## Errors" >> diagnostic/python_syntax.md
            cat diagnostic/syntax_errors.tmp >> diagnostic/python_syntax.md
          fi

          rm -f diagnostic/syntax_errors.tmp

          if [ "$ERROR_COUNT" -gt 0 ]; then
            exit 1
          fi

      - name: JULIE Android pattern scan
        shell: bash
        run: |
          echo "# ANDROID / KIVY RISK SCAN" > diagnostic/android_risk_scan.md
          echo "" >> diagnostic/android_risk_scan.md

          echo "## Hardcoded Android storage paths" >> diagnostic/android_risk_scan.md
          grep -RniE \
            "/storage/emulated/0|/sdcard/|/mnt/sdcard/" \
            --include="*.py" \
            --include="*.java" \
            --exclude-dir=.git \
            . >> diagnostic/android_risk_scan.md || true

          echo "" >> diagnostic/android_risk_scan.md
          echo "## Speech / microphone references" >> diagnostic/android_risk_scan.md
          grep -RniE \
            "SpeechRecognizer|RecognitionListener|RECORD_AUDIO|startListening|createSpeechRecognizer" \
            --include="*.py" \
            --include="*.java" \
            --exclude-dir=.git \
            . >> diagnostic/android_risk_scan.md || true

          echo "" >> diagnostic/android_risk_scan.md
          echo "## JNI references" >> diagnostic/android_risk_scan.md
          grep -RniE \
            "jnius|autoclass|PythonActivity|run_on_ui_thread" \
            --include="*.py" \
            --include="*.java" \
            --exclude-dir=.git \
            . >> diagnostic/android_risk_scan.md || true

          echo "" >> diagnostic/android_risk_scan.md
          echo "## Kivy references" >> diagnostic/android_risk_scan.md
          grep -RniE \
            "kivy|Window|TextInput|Canvas|RoundedRectangle|Clock" \
            --include="*.py" \
            --exclude-dir=.git \
            . >> diagnostic/android_risk_scan.md || true

      - name: Buildozer configuration check
        shell: bash
        run: |
          echo "# BUILDOZER CHECK" > diagnostic/buildozer.md
          echo "" >> diagnostic/buildozer.md

          if [ -f "buildozer.spec" ]; then
            echo "buildozer.spec: FOUND" >> diagnostic/buildozer.md
            echo "" >> diagnostic/buildozer.md
            echo "## Requirements" >> diagnostic/buildozer.md
            grep -n "^requirements" buildozer.spec >> diagnostic/buildozer.md || true
            echo "" >> diagnostic/buildozer.md
            echo "## Android configuration" >> diagnostic/buildozer.md
            grep -nE \
              "android\.permissions|android\.api|android\.minapi|android\.sdk|android\.archs|android\.add_src" \
              buildozer.spec >> diagnostic/buildozer.md || true
          else
            echo "WARNING: buildozer.spec NOT FOUND" >> diagnostic/buildozer.md
          fi

      - name: Main.py analysis
        shell: bash
        run: |
          echo "# MAIN.PY ANALYSIS" > diagnostic/main_analysis.md
          echo "" >> diagnostic/main_analysis.md

          if [ -f "main.py" ]; then
            LINES=$(wc -l < main.py)
            BYTES=$(wc -c < main.py)

            echo "main.py: FOUND" >> diagnostic/main_analysis.md
            echo "Lines: $LINES" >> diagnostic/main_analysis.md
            echo "Bytes: $BYTES" >> diagnostic/main_analysis.md
            echo "" >> diagnostic/main_analysis.md

            echo "## Imports" >> diagnostic/main_analysis.md
            grep -nE "^(import |from )" main.py >> diagnostic/main_analysis.md || true

            echo "" >> diagnostic/main_analysis.md
            echo "## Classes" >> diagnostic/main_analysis.md
            grep -nE "^class " main.py >> diagnostic/main_analysis.md || true

            echo "" >> diagnostic/main_analysis.md
            echo "## Functions" >> diagnostic/main_analysis.md
            grep -nE "^def |^    def " main.py >> diagnostic/main_analysis.md || true
          else
            echo "ERROR: main.py NOT FOUND" >> diagnostic/main_analysis.md
          fi

      - name: Detect duplicate and backup files
        shell: bash
        run: |
          echo "# DUPLICATE / BACKUP FILE CHECK" > diagnostic/duplicates.md
          echo "" >> diagnostic/duplicates.md

          find . -type f \
            \( -name "*.backup*" \
            -o -name "*.bak" \
            -o -name "*backup*" \
            -o -name "*copy*" \
            -o -name "*.old" \) \
            -not -path "./.git/*" \
            -print >> diagnostic/duplicates.md || true

      - name: Generate final summary
        shell: bash
        run: |
          cat > diagnostic/FINAL_REPORT.md <<'EOF'
          # JULIE AI OS — FINAL DIAGNOSTIC REPORT

          This report is generated automatically by GitHub Actions.

          ## Purpose

          This diagnostic checks:

          1. Project structure
          2. Python syntax
          3. main.py size and structure
          4. Android storage paths
          5. Microphone / SpeechRecognizer usage
          6. PyJNIus / PythonActivity usage
          7. Kivy UI references
          8. Buildozer configuration
          9. Backup / duplicate files

          ## Important

          This report does NOT automatically change JULIE source code.

          A detected pattern is not automatically a confirmed bug.
          It must be reviewed against the Android runtime behavior and logs.
          EOF

          echo "" >> diagnostic/FINAL_REPORT.md
          echo "## Generated Reports" >> diagnostic/FINAL_REPORT.md
          echo "- project_report.md" >> diagnostic/FINAL_REPORT.md
          echo "- python_syntax.md" >> diagnostic/FINAL_REPORT.md
          echo "- android_risk_scan.md" >> diagnostic/FINAL_REPORT.md
          echo "- buildozer.md" >> diagnostic/FINAL_REPORT.md
          echo "- main_analysis.md" >> diagnostic/FINAL_REPORT.md
          echo "- duplicates.md" >> diagnostic/FINAL_REPORT.md

      - name: Upload diagnostic report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: JULIE-Diagnostic-Report
          path: diagnostic/
          retention-days: 30